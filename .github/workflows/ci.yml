name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:                       # job 名即任务 3 中要选择的必需检查名称
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # TODO 1：安装 Go。go.mod 声明 go 1.26，这里固定到 1.26.9，保证 PR 与 main 用同一版本。
      # cache 默认 true，会去找 go.sum；本模块只用标准库、没有 go.sum，关掉以免每次运行都报缓存警告。
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false

      # TODO 2：打印本次运行的上下文，放在测试之前，测试失败时也能看到。
      # push 事件没有 pull_request 字段，head.sha 会是空字符串，这与问题 2 有关。
      - name: Show run context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "github.event_name                  = $EVENT_NAME"
          echo "github.ref                         = $REF"
          echo "github.sha                         = $SHA"
          echo "github.event.pull_request.head.sha = $PR_HEAD_SHA"

      # TODO 3：格式、静态检查、测试各占一个 step，失败时一眼看出是哪一步。
      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      # TODO 4：只在 push 到 main（即合并之后）时构建可发布的主干制品。
      - name: Package
        if: github.event_name == 'push'
        env:
          VERSION: 0.0.0-main
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package \
            VERSION="$VERSION" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$COMMIT"

      # 打印二进制和归档的校验和：日志里留痕，问题 3 比较两次 Re-run 时直接读这里。
      - name: Checksums
        if: github.event_name == 'push'
        run: |
          sha256sum dist/*/enroll-conflict
          sha256sum dist/*.tar.gz

      # 制品名里带上提交号和构建号，便于事后对应到具体运行。
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: enroll-conflict-${{ github.sha }}-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 14
